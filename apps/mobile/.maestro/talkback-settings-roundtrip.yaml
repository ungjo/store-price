appId: ${APP_ID || 'host.exp.exponent'}
name: 앱에서 Android 접근성 설정 열기와 복귀 확인
---
# 상품을 담은 위치에서 위로 이동해 버튼을 누릅니다. 기기의 화면 읽기 상태는 그대로 둡니다.
- scrollUntilVisible:
    element: { id: talkback-settings }
    direction: UP
    timeout: 30000
- tapOn: { id: talkback-settings, text: '^TalkBack 설정 열기, 화면 읽기 (켜짐|꺼짐)$', enabled: true }
- extendedWaitUntil:
    visible: { text: '^(접근성|Accessibility|TalkBack)$' }
    timeout: 15000
- assertNotVisible: { id: talkback-settings }
- back
- waitForAnimationToEnd
# 삼성 태블릿 설정은 두 패널을 차례로 닫기도 합니다. 여전히 설정이고 앱 버튼이 없을 때만 뒤로 갑니다.
- runFlow:
    when:
      visible: { id: '^com\.android\.settings:id/action_bar_root$' }
      notVisible: { id: talkback-settings }
    commands:
      - back
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: talkback-settings, text: '^TalkBack 설정 열기, 화면 읽기 (켜짐|꺼짐)$' }
    timeout: 15000
