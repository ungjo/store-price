    text: "^숫자만 입력해 주세요\\. 거스름돈이 없으면 0을 적어요\\.$"
- scrollUntilVisible:
    element:
      id: "quiz-answer"
    direction: UP
    timeout: 30000
    centerElement: false
- tapOn:
    id: "quiz-answer"
    enabled: true
- inputText: "500"
- hideKeyboard
- scrollUntilVisible:
