appId: host.exp.exponent
name: 놀이돈 선택과 장바구니 실기기 회귀 검사
# EXPO_URL과 RUN_ID는 실행기가 같은 Expo 서버의 주소와 실행 번호로 전달합니다.
# 스크린샷은 --test-output-dir로 지정한 이번 실행의 결과 폴더에만 저장합니다.
---

# 이전 Expo Go 실행을 닫고 현재 소스를 확인한 뒤 시작합니다. 앱 데이터는 지우지 않습니다.
# Expo Go를 먼저 띄워 콜드 스타트와 개발 주소 열기를 분리합니다.
# 빈 permissions는 기존 권한을 유지하고, clearState:false는 앱 데이터를 보존합니다.
- stopApp
- launchApp:
    appId: host.exp.exponent
    clearState: false
    stopApp: false
    permissions: {}
- waitForAnimationToEnd:
    timeout: 10000
- openLink: "${EXPO_URL}"
- extendedWaitUntil:
    visible:
      id: "device-run-marker"
      text: "^자동 검사 ${RUN_ID}$"
    timeout: 90000
- assertVisible:
    id: "device-run-marker"
    text: "^자동 검사 ${RUN_ID}$"
- assertVisible:
    id: "cart-summary"
    text: "^장바구니 총 0개, 합계 0원\\. 오늘의 놀이돈 10,000원\\. 남을 돈 10,000원\\. 놀이돈 안에서 장을 봐요\\.$"
- scrollUntilVisible:
    element:
      id: "cart-empty"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "cart-empty"
    text: "^아직 장바구니가 비어 있어요$"
- scrollUntilVisible:
    element:
      id: "payment-option-1000"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "payment-option-1000"
    enabled: false
    selected: false
- scrollUntilVisible:
    element:
      id: "payment-option-5000"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "payment-option-5000"
    enabled: false
    selected: false
- scrollUntilVisible:
    element:
      id: "payment-option-10000"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "payment-option-10000"
    enabled: false
    selected: false
- scrollUntilVisible:
    element:
      id: "payment-result"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "payment-result"
    text: "^선택한 돈 없음\\. 먼저 물건을 담아 주세요\\.$"

# 사과 2개와 우유 1개: 5,500원에서 5,000원을 고르면 500원이 부족합니다.
- scrollUntilVisible:
    element:
      id: "product-sample-apple-add"
    direction: UP
    timeout: 30000
    centerElement: false
- tapOn:
    id: "product-sample-apple-add"
    enabled: true
- tapOn:
    id: "product-sample-apple-add"
    enabled: true
- scrollUntilVisible:
