      id: "product-sample-milk-add"
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: "product-sample-milk-add"
    enabled: true
- assertVisible:
    id: "cart-summary"
    text: "^장바구니 총 3개, 합계 5,500원\\. 오늘의 놀이돈 10,000원\\. 남을 돈 4,500원\\. 이대로 사면 남을 돈이에요\\.$"
- scrollUntilVisible:
    element:
      id: "payment-option-5000"
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: "payment-option-5000"
    enabled: true
- assertVisible:
    id: "payment-option-5000"
    enabled: true
    selected: true
- scrollUntilVisible:
