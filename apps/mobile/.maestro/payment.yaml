# 낼 돈에서 물건값을 뺀 금액과 읽어 주는 계산식을 함께 확인합니다.

# 첫 문제는 빈 답 제출, 오답 수정, 정답 잠금과 다시 풀기를 한 번씩 확인합니다.
- assertVisible:
    id: "cart-summary"
