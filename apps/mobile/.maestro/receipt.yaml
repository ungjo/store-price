      id: "checkout-complete"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "checkout-complete"
    enabled: true
- tapOn:
    id: "checkout-complete"
    enabled: true
- assertVisible:
    id: "receipt-screen"
- assertVisible:
    id: "receipt-title"
    text: "^계산을 마쳤어요!$"
- assertNotVisible:
    id: "market-list"
- assertNotVisible:
    id: "cart-summary"
- assertNotVisible:
    id: "payment-selector"
- assertNotVisible:
    id: "quiz-answer"
- assertNotVisible:
    id: "checkout-complete"
- scrollUntilVisible:
    element:
      id: "receipt-item-sample-apple"
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: "receipt-item-sample-apple"
    text: "^사과, 1개\\. 1,500원 × 2개, 3,000원\\.$"
- scrollUntilVisible:
