- assertVisible:
    id: "receipt-payment"
    text: "^낸 놀이돈 10,000원\\. 받은 거스름돈 4,500원\\. 계산 후 남은 놀이돈 4,500원\\.$"
- takeScreenshot: receipt-apple-milk

# 다시 장보기를 누르면 장바구니·선택·퀴즈가 비고 놀이돈은 10,000원부터 시작합니다.
