appId: ${APP_ID}
name: 새로 설치한 독립 APK의 실제 오프라인 첫 실행
# 실행기가 APK·설치 이력·실제 연결 차단을 먼저 확인합니다. Expo 주소와 데이터 초기화는 사용하지 않습니다.
---
- launchApp:
    appId: ${APP_ID}
    clearState: false
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: catalog-error
      text: '^물건을 불러오지 못했어요$'
    timeout: 45000
- assertNotVisible:
    id: catalog-test-marker
- assertNotVisible:
    id: preview-open
- takeScreenshot: standalone-offline-first-launch
- tapOn:
    id: catalog-use-samples
    enabled: true
- assertVisible:
    id: device-run-marker
    text: '^자동 검사 ${RUN_ID}$'
- assertVisible:
    id: catalog-source-marker
    text: '^상품 출처 sample$'
- assertVisible:
    id: catalog-loaded-count
    text: '^불러온 상품 12개$'
- assertVisible:
    id: cart-summary
    text: '^장바구니 총 0개, 합계 0원\. 오늘의 놀이돈 10,000원\. 남을 돈 10,000원\. 놀이돈 안에서 장을 봐요\.$'
- scrollUntilVisible:
    element:
      id: catalog-origin
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: catalog-origin
    text: '^앱에 준비된 예시 상품으로 놀고 있어요\.$'
- scrollUntilVisible:
    element:
      id: product-sample-apple-add
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: product-sample-apple-add
    enabled: true
- tapOn:
    id: product-sample-apple-add
    enabled: true
- scrollUntilVisible:
    element:
      id: product-sample-milk-add
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: product-sample-milk-add
    enabled: true
- assertVisible:
    id: cart-summary
    text: '^장바구니 총 3개, 합계 5,500원\. 오늘의 놀이돈 10,000원\. 남을 돈 4,500원\. 이대로 사면 남을 돈이에요\.$'
- scrollUntilVisible:
    element:
      id: payment-option-10000
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: payment-option-10000
    enabled: true
- scrollUntilVisible:
    element:
      id: quiz-answer
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: cart-summary
    text: '^장바구니 총 3개, 합계 5,500원\. 오늘의 놀이돈 10,000원\. 거스름돈을 맞히면 남을 돈을 보여 줘요\.$'
- tapOn:
    id: quiz-answer
    enabled: true
- inputText: '4500'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: quiz-check
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: quiz-check
    enabled: true
- scrollUntilVisible:
    element:
      id: quiz-feedback
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: quiz-feedback
    text: '^정답이에요! 거스름돈을 잘 계산했어요\.$'
- scrollUntilVisible:
    element:
      id: checkout-complete
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: checkout-complete
    enabled: true
- assertVisible:
    id: receipt-title
    text: '^계산을 마쳤어요!$'
- scrollUntilVisible:
    element:
      id: receipt-item-sample-apple
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: receipt-item-sample-apple
    text: '^사과, 1개\. 1,500원 × 2개, 3,000원\.$'
- scrollUntilVisible:
    element:
      id: receipt-item-sample-milk
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: receipt-item-sample-milk
    text: '^우유, 1팩 · 1L\. 2,500원 × 1개, 2,500원\.$'
- scrollUntilVisible:
    element:
      id: receipt-total
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: receipt-total
    text: '^총 3개, 합계 5,500원\.$'
- scrollUntilVisible:
    element:
      id: receipt-payment
    direction: DOWN
    timeout: 30000
    centerElement: false
- assertVisible:
    id: receipt-payment
    text: '^낸 놀이돈 10,000원\. 받은 거스름돈 4,500원\. 계산 후 남은 놀이돈 4,500원\.$'
- takeScreenshot: standalone-offline-receipt
- scrollUntilVisible:
    element:
      id: receipt-new-round
    direction: DOWN
    timeout: 30000
    centerElement: false
- tapOn:
    id: receipt-new-round
    enabled: true
- assertVisible:
    id: catalog-source-marker
    text: '^상품 출처 sample$'
- assertVisible:
    id: cart-summary
    text: '^장바구니 총 0개, 합계 0원\. 오늘의 놀이돈 10,000원\. 남을 돈 10,000원\. 놀이돈 안에서 장을 봐요\.$'
- assertNotVisible:
    id: receipt-screen
- assertNotVisible:
    id: catalog-loading
# 네트워크 차단을 유지한 채 프로세스만 다시 시작합니다. 앱 자료는 지우지 않습니다.
- stopApp
- launchApp:
    appId: ${APP_ID}
    clearState: false
    stopApp: false
    permissions: {}
- extendedWaitUntil:
    visible:
      id: catalog-error
      text: '^물건을 불러오지 못했어요$'
    timeout: 45000
- tapOn:
    id: catalog-use-samples
    enabled: true
- assertVisible:
    id: device-run-marker
    text: '^자동 검사 ${RUN_ID}$'
- assertVisible:
    id: catalog-source-marker
    text: '^상품 출처 sample$'
- assertVisible:
    id: catalog-loaded-count
    text: '^불러온 상품 12개$'
- assertVisible:
    id: cart-summary
    text: '^장바구니 총 0개, 합계 0원\. 오늘의 놀이돈 10,000원\. 남을 돈 10,000원\. 놀이돈 안에서 장을 봐요\.$'
- assertNotVisible:
    id: catalog-test-marker
- assertNotVisible:
    id: preview-open
- takeScreenshot: standalone-offline-relaunch
