<text x="27" y="59" font-size="15.4" fill="#151515" text-anchor="start" font-weight="700">Configuring the terminal emulator to use with Git Bash</text>
<text x="49" y="81" font-size="14.5" fill="#151515" text-anchor="start">Which terminal emulator do you want to use with your Git Bash?</text>
<circle cx="60" cy="137" r="8" fill="white" stroke="#747474" stroke-width="1.3"/>
<circle cx="60" cy="137" r="4.9" fill="#343434"/>
<rect x="72" y="126.3" width="316.501953125" height="19" fill="none" stroke="#646464" stroke-width=".9" stroke-dasharray="1.5 1.5"/>
<text x="74" y="142" font-size="15" fill="#151515" text-anchor="start" font-weight="700">Use MinTTY (the default terminal of MSYS2)</text>
<text x="81" y="166" font-size="14.5" fill="#161616" text-anchor="start">Git Bash will use MinTTY as terminal emulator, which sports a resizable</text>
<text x="81" y="184.8" font-size="14.5" fill="#161616" text-anchor="start">window, non-rectangular selections and a Unicode font. Windows console</text>
<text x="81" y="203.60000000000002" font-size="14.5" fill="#161616" text-anchor="start">programs (such as interactive Python) must be launched via `winpty` to work</text>
<text x="81" y="222.40000000000003" font-size="14.5" fill="#161616" text-anchor="start">in MinTTY.</text>
<circle cx="60" cy="256.20000000000005" r="8" fill="white" stroke="#747474" stroke-width="1.3"/>
<text x="74" y="261.20000000000005" font-size="15" fill="#151515" text-anchor="start" font-weight="700">Use Windows' default console window</text>
<text x="81" y="285.20000000000005" font-size="14.5" fill="#161616" text-anchor="start">Git will use the default console window of Windows ("cmd.exe"), which works</text>
<text x="81" y="304.00000000000006" font-size="14.5" fill="#161616" text-anchor="start">well with Win32 console programs such as interactive Python or node.js, but</text>
<text x="81" y="322.80000000000007" font-size="14.5" fill="#161616" text-anchor="start">has a very limited default scroll-back, needs to be configured to use a</text>
<text x="81" y="341.6000000000001" font-size="14.5" fill="#161616" text-anchor="start">Unicode font in order to display non-ASCII characters correctly, and prior to</text>
<text x="81" y="360.4000000000001" font-size="14.5" fill="#161616" text-anchor="start">Windows 10 its window was not freely resizable and it only allowed</text>
<text x="81" y="379.2000000000001" font-size="14.5" fill="#161616" text-anchor="start">rectangular text selections.</text>
<rect x="1" y="431" width="598" height="58" fill="#efefef" stroke="none" stroke-width="1"/>
<path d="M1 431h598" fill="none" stroke="#b7b7b7" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
