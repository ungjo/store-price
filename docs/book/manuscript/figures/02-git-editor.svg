<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2405" viewBox="0 0 600 481" role="img" aria-labelledby="title desc">
<title id="title">Git 2.28.0 Setup — Choosing the default editor used by Git</title>
<desc id="desc">실제 Git for Windows 설치 화면에 근거해 글자와 조작 요소를 벡터로 다시 그린 학습용 도해. 펼침 목록에서 Visual Studio Code를 Git 기본 편집기로 고른 상태.</desc>
<metadata>{"basis": "https://raw.githubusercontent.com/ubc-dsci/dsci-310-student/11725e8dbee9af0c5032cd83153c3e96715b3c3e/resources/vscode_as_git_editor.png", "credit": "UBC DSCI 310 contributors (파일 등록 Daniel Chen)", "license": "CC BY 4.0", "logo": "Git for Windows 아이콘은 해당 캡처의 오른쪽 위에서 발췌했다.", "changes": "앞서 보이는 내용과 선택 상태를 유지하고 책에서 읽기 좋게 글꼴 크기 및 일부 줄바꿈을 조정했다."}</metadata>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="0.8" y="0.8" width="598.4" height="479.4" fill="#f0f0f0" stroke="#737d85" stroke-width="1.2"/>
<rect x="1.5" y="1.5" width="597" height="90" fill="white" stroke="none" stroke-width="1"/>
<image x="8" y="7" width="18" height="18" href="data:image/png;base64,"/>
<text x="31" y="22" font-size="15" fill="#161616" text-anchor="start">Git 2.28.0 Setup</text>
<path d="M468 15 h11" fill="none" stroke="#222" stroke-width="1" stroke-linecap="square" stroke-linejoin="round"/>
<rect x="516" y="10" width="10" height="9" fill="white" stroke="#bdc1c4" stroke-width="1"/>
<path d="M570 10 l10 10 M580 10 l-10 10" fill="none" stroke="#222" stroke-width="1" stroke-linecap="square" stroke-linejoin="round"/>
<text x="26" y="52" font-size="15.5" fill="#161616" text-anchor="start" font-weight="700">Choosing the default editor used by Git</text>
<text x="43" y="74" font-size="13.7" fill="#161616" text-anchor="start">Which editor would you like Git to use?</text>
<image x="544" y="36" width="45" height="45" href="data:image/png;base64,"/>
<path d="M1 91.5 H599" fill="none" stroke="#9b9b9b" stroke-width="1" stroke-linecap="square" stroke-linejoin="round"/>
<rect x="51" y="123" width="499" height="26" fill="#e4e4e4" stroke="#969696" stroke-width="1"/>
<text x="57" y="141" font-size="14.0" fill="#161616" text-anchor="start">Use Visual Studio Code as Git's default editor</text>
<path d="M534 134 l4 4 l4 -4" fill="none" stroke="#3b3b3b" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="round"/>
<text x="72" y="171" font-size="13.8" fill="#161616" text-anchor="start"><tspan fill="#da1712">(NEW!)</tspan> <tspan fill="#0000cd" text-decoration="underline">Visual Studio Code</tspan> is an Open Source, lightweight and powerful editor</text>
<text x="72" y="191" font-size="13.8" fill="#161616" text-anchor="start">running as a desktop application. It comes with built-in support for JavaScript,</text>
<text x="72" y="211" font-size="13.8" fill="#161616" text-anchor="start">TypeScript and Node.js and has a rich ecosystem of extensions for other</text>
<text x="72" y="231" font-size="13.8" fill="#161616" text-anchor="start">languages (such as C++, C#, Java, Python, PHP, Go) and runtimes (such as</text>
<text x="72" y="251" font-size="13.8" fill="#161616" text-anchor="start">.NET and Unity).</text>
<text x="72" y="272" font-size="13.8" fill="#d41410" text-anchor="start">(WARNING!) This will be installed only for this user.</text>
<text x="72" y="312" font-size="13.8" fill="#161616" text-anchor="start">Use this option to let Git use Visual Studio Code as its default editor.</text>
<path d="M1 426 H599" fill="none" stroke="#a3a3a3" stroke-width="1" stroke-linecap="square" stroke-linejoin="round"/>
<rect x="3" y="417" width="140" height="18" fill="#f0f0f0" stroke="none" stroke-width="1"/>
<text x="5" y="430" font-size="12.2" fill="#707070" text-anchor="start">https://gitforwindows.org/</text>
<rect x="124" y="446" width="14" height="14" fill="white" stroke="#434343" stroke-width="1"/>
<text x="143" y="458" font-size="13.1" fill="#161616" text-anchor="start">Only show new options</text>
<rect x="325" y="441" width="81" height="25" fill="#e5e5e5" stroke="#9a9a9a" stroke-width="1"/><text x="365.5" y="458.5" font-size="13.7" fill="#161616" text-anchor="middle">&lt; Back</text>
<rect x="415" y="441" width="81" height="25" fill="#e5e5e5" stroke="#0874be" stroke-width="1.6"/><text x="455.5" y="458.5" font-size="13.7" fill="#161616" text-anchor="middle">Next &gt;</text>
<rect x="505" y="441" width="81" height="25" fill="#e5e5e5" stroke="#9a9a9a" stroke-width="1"/><text x="545.5" y="458.5" font-size="13.7" fill="#161616" text-anchor="middle">Cancel</text>
