<title id="title">Completing the Git Setup Wizard</title>
<desc id="desc">실제 Git 2.25.0 설치 캡처를 바탕으로 재구성한 도해. 설치 완료. Launch Git Bash는 해제되어 있고 View Release Notes는 선택되어 있다.</desc>
