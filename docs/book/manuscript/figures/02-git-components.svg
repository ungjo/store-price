<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2390" viewBox="0 0 580 462" role="img" aria-labelledby="title desc">
<title id="title">Git 2.32.0.2 Setup — Select Components</title>
<desc id="desc">실제 Git for Windows 설치 화면에 근거해 글자와 조작 요소를 벡터로 다시 그린 학습용 도해. Windows Explorer integration, Git Bash Here 및 Git GUI Here가 선택된 상태.</desc>
<metadata>{"basis": "https://raw.githubusercontent.com/ubc-dsci/dsci-310-student/11725e8dbee9af0c5032cd83153c3e96715b3c3e/resources/git_bash_profile.png", "credit": "UBC DSCI 310 contributors (파일 등록 Daniel Chen)", "license": "CC BY 4.0", "logo": "Git for Windows 아이콘은 해당 캡처의 오른쪽 위에서 발췌했다.", "changes": "앞서 보이는 내용과 선택 상태를 유지하고 책에서 읽기 좋게 글꼴 크기 및 일부 줄바꿈을 조정했다."}</metadata>
