<use href="#git-symbol" xlink:href="#git-symbol" x="537" y="38" width="49" height="49"/>
<text x="27" y="59" font-size="15.4" fill="#151515" text-anchor="start" font-weight="700">Adjusting your PATH environment</text>
<text x="49" y="81" font-size="14.5" fill="#151515" text-anchor="start">How would you like to use Git from the command line?</text>
<circle cx="60" cy="137" r="8" fill="white" stroke="#747474" stroke-width="1.3"/>
<text x="74" y="142" font-size="15" fill="#151515" text-anchor="start" font-weight="700">Use Git from Git Bash only</text>
<text x="81" y="166" font-size="14.5" fill="#161616" text-anchor="start">This is the most cautious choice as your PATH will not be modified at all. You</text>
<text x="81" y="184.8" font-size="14.5" fill="#161616" text-anchor="start">will only be able to use the Git command line tools from Git Bash.</text>
<circle cx="60" cy="218.60000000000002" r="8" fill="white" stroke="#747474" stroke-width="1.3"/>
<circle cx="60" cy="218.60000000000002" r="4.9" fill="#343434"/>
<rect x="72" y="207.90000000000003" width="433.87890625" height="19" fill="none" stroke="#646464" stroke-width=".9" stroke-dasharray="1.5 1.5"/>
<text x="74" y="223.60000000000002" font-size="15" fill="#151515" text-anchor="start" font-weight="700">Git from the command line and also from 3rd-party software</text>
<text x="81" y="247.60000000000002" font-size="14.5" fill="#161616" text-anchor="start"><tspan fill="#bc1616">(Recommended)</tspan> This option adds only some minimal Git wrappers to your</text>
<text x="81" y="266.40000000000003" font-size="14.5" fill="#161616" text-anchor="start">PATH to avoid cluttering your environment with optional Unix tools. You will</text>
<text x="81" y="285.20000000000005" font-size="14.5" fill="#161616" text-anchor="start">be able to use Git from Git Bash, the Command Prompt and the Windows</text>
<text x="81" y="304.00000000000006" font-size="14.5" fill="#161616" text-anchor="start">PowerShell as well as any third-party software looking for Git in PATH.</text>
<circle cx="60" cy="337.80000000000007" r="8" fill="white" stroke="#747474" stroke-width="1.3"/>
<text x="74" y="342.80000000000007" font-size="15" fill="#151515" text-anchor="start" font-weight="700">Use Git and optional Unix tools from the Command Prompt</text>
<text x="81" y="366.80000000000007" font-size="14.5" fill="#161616" text-anchor="start">Both Git and the optional Unix tools will be added to your PATH.</text>
<text x="81" y="385.6000000000001" font-size="14.5" fill="#bc1616" text-anchor="start">Warning: This will override Windows tools like "find" and "sort". Only use this</text>
<text x="81" y="404.4000000000001" font-size="14.5" fill="#bc1616" text-anchor="start">option if you understand the implications.</text>
<rect x="1" y="438" width="598" height="58" fill="#efefef" stroke="none" stroke-width="1"/>
<path d="M1 438h598" fill="none" stroke="#b7b7b7" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1" y="430" width="164" height="16" fill="#efefef" stroke="none" stroke-width="1"/>
