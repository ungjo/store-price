<g xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Segoe UI, sans-serif" fill="#141414">
  <text x="24" y="50" font-size="13.5" font-weight="700">사용권 계약</text>
  <text x="40" y="67" font-size="12.6">계속하기 전에 다음의 중요 정보를 읽어보십시오.</text>
  <text x="40" y="110" font-size="12.9">다음 사용권 계약을 읽어보십시오, 설치를 계속하려면 이 계약에 동의해야 합니다.</text>

  <rect x="40.5" y="123.5" width="517" height="226" fill="#fff" stroke="#c8c8c8"/>
  <g id="license-visible-terms" font-size="15.1" font-style="italic">
    <text x="45" y="151">이 라이선스는 Visual Studio 코드 제품에 적용됩니다. Visual Studio</text>
    <text x="45" y="178">코드의 소스 코드는 MIT 라이선스 계약</text>
    <text x="45" y="205">(<tspan fill="#095e9b" text-decoration="underline">https://github.com/microsoft/vscode/blob/main/LICENSE.txt</tspan>) 아래</text>
    <text x="45" y="232"><tspan fill="#095e9b" text-decoration="underline">https://github.com/Microsoft/vscode</tspan>에 나와 있습니다. 추가 라이선스</text>
    <text x="45" y="259">정보는 FAQ(<tspan fill="#095e9b" text-decoration="underline">https://code.visualstudio.com/docs/supporting/faq</tspan>)에서</text>
    <text x="45" y="286">참조할 수 있습니다.</text>
  </g>
  <text x="43" y="333" font-size="20.5" font-weight="700">MICROSOFT 소프트웨어 라이선스 계약서</text>

