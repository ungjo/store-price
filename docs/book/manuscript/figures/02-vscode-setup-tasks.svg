<title id="figureTitle">Visual Studio Code 사용자용 설치기 · 추가 작업 선택</title>
<desc id="figureDesc">한국어 Windows에서 연 VS Code 1.147.0의 실제 설치 캡처를 바탕으로 재구성한 도해. 글자와 단추를 벡터로 조판했다.</desc>
